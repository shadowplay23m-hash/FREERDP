name: Windows Tailscale

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          }

          & $ts up `
            --auth-key="$env:TS_AUTHKEY" `
            --hostname="github-windows"

      - name: Generate Username and Password
        shell: powershell
        run: |
          $letters = "abcdefghijklmnopqrstuvwxyz"
          $username = "rdp_" + (-join (1..6 | ForEach-Object {
            $letters[(Get-Random -Maximum $letters.Length)]
          }))

          $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"
          $password = -join (1..6 | ForEach-Object {
            $chars[(Get-Random -Maximum $chars.Length)]
          })

          Write-Host ""
          Write-Host "=============================="
          Write-Host "USERNAME: $username"
          Write-Host "PASSWORD: $password"
          Write-Host "=============================="
          Write-Host ""

      - name: Show Tailscale IP
        shell: powershell
        run: |
          $ts = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          }

          Write-Host "Tailscale IP:"
          & $ts ip -4

          Write-Host ""
          Write-Host "Tailscale status:"
          & $ts status
