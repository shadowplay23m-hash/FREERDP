
name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          Set-ItemProperty -LiteralPath $rdpPath -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty -LiteralPath $tcpPath -Name 'UserAuthentication' -Value 1 -Force

          Write-Host 'RDP registry settings checked.'

      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Add-Type -AssemblyName System.Security

          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue

          if (-not $existingUser) {
            New-LocalUser -Name 'RDP' -Password $securePass -AccountNeverExpires
          } else {
            Set-LocalUser -Name 'RDP' -Password $securePass
          }

          Write-Host 'RDP user credential generation completed.'
          Write-Host 'Username: RDP'
          Write-Host 'This diagnostic workflow does not provide remote RDP login.'

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installerPath -Force

          if ($process.ExitCode -notin @(0, 3010)) {
            throw 'Tailscale installation failed.'
          }

      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw 'TAILSCALE_AUTH_KEY secret is missing.'
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw 'Tailscale connection failed.'
          }

          $tsIP = & $ts ip -4

          if (-not $tsIP) {
            throw 'Tailscale IP not assigned.'
          }

          Write-Host "Tailscale IP: $tsIP"

      - name: Verify Configuration
        shell: powershell
        run: |
          Write-Host 'Configuration checks completed.'
          Write-Host 'GitHub-hosted runner is temporary.'
          Write-Host 'This workflow does not provide persistent RDP access.'

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $ts) {
            & $ts logout
          }

          Write-Host 'Cleanup completed.'
