name: Windows Tailscale

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TS_AUTHKEY GitHub Secret is missing."
          }

          & $ts up `
            --auth-key="$env:TS_AUTHKEY" `
            --hostname="github-windows"

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ts = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          }

          Write-Host "Tailscale IPv4:"
          & $ts ip -4

          Write-Host ""
          Write-Host "Tailscale status:"
          & $ts status

      - name: Test connectivity
        shell: powershell
        run: |
          $ts = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          }

          & $ts netcheck
